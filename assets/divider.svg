<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00f0ff"/>
      <stop offset="0.8" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="6" width="1000" height="2"/></clipPath>
  </defs>
  <style>
    .shine{animation:run 4s linear infinite}
    .dia{animation:pulse 2s ease-in-out infinite}
    @keyframes run{0%{transform:translateX(-220px)}100%{transform:translateX(1000px)}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect x="0" y="6" width="1000" height="2" fill="url(#line)" opacity="0.7"/>
  <g clip-path="url(#clip)">
    <rect class="shine" x="0" y="5" width="220" height="4" fill="url(#shine)"/>
  </g>
  <path class="dia" d="M500 1L506 7L500 13L494 7Z" fill="#0a0e17" stroke="#00f0ff" stroke-width="1.5"/>
</svg>
