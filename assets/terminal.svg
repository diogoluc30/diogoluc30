<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Terminal com meus objetivos atuais">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
  </defs>

  <style>
    text{font-family:'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:15px;fill:#c9d1d9}
    .u{fill:#39ff14}
    .p{fill:#00f0ff}
    .m{fill:#ff2bd6}
    .w{fill:#ffffff}
    .cv{fill:#0a0e17}
    .cur{animation:bl 1s steps(1) infinite}

    /* Ciclo total: 22s. Cada linha é "digitada" por uma máscara que desliza para a direita */
    .c0{animation:t0 22s infinite steps(26,end)}
    .c1{animation:t1 22s infinite steps(26,end)}
    .c2{animation:t2 22s infinite steps(39,end)}
    .c3{animation:t3 22s infinite steps(42,end)}
    .c4{animation:t4 22s infinite steps(49,end)}
    .c5{animation:t5 22s infinite steps(49,end)}
    .c6{animation:t6 22s infinite steps(42,end)}
    .c7{animation:t7 22s infinite steps(48,end)}
    .c8{animation:t8 22s infinite steps(20,end)}

    @keyframes t0{0%,3%{transform:translateX(0)}9%,100%{transform:translateX(246px)}}
    @keyframes t1{0%,12%{transform:translateX(0)}18%,100%{transform:translateX(246px)}}
    @keyframes t2{0%,21%{transform:translateX(0)}27%,100%{transform:translateX(363px)}}
    @keyframes t3{0%,30%{transform:translateX(0)}36%,100%{transform:translateX(390px)}}
    @keyframes t4{0%,39%{transform:translateX(0)}45%,100%{transform:translateX(453px)}}
    @keyframes t5{0%,48%{transform:translateX(0)}54%,100%{transform:translateX(453px)}}
    @keyframes t6{0%,57%{transform:translateX(0)}63%,100%{transform:translateX(390px)}}
    @keyframes t7{0%,66%{transform:translateX(0)}72%,100%{transform:translateX(444px)}}
    @keyframes t8{0%,75%{transform:translateX(0)}81%,100%{transform:translateX(192px)}}
    @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}

    @media (prefers-reduced-motion: reduce){*{animation:none!important}.cv{display:none}}
  </style>

  <!-- Janela -->
  <rect x="1" y="1" width="898" height="338" rx="12" fill="#0a0e17" stroke="url(#neon)" stroke-width="1.5"/>
  <path d="M13 1H887A12 12 0 0 1 899 13V37H1V13A12 12 0 0 1 13 1Z" fill="#0f172a"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="19" r="6" fill="#27c93f"/>
  <text x="450" y="24" text-anchor="middle" style="font-size:13px;fill:#5f7796">visitante@github: ~/objetivos</text>

  <!-- Linhas -->
  <text x="40" y="82"><tspan class="u">visitante@github</tspan><tspan class="w">:</tspan><tspan class="p">~</tspan><tspan class="w">$ </tspan>whoami</text>
  <text x="40" y="110"><tspan class="m">&gt; </tspan>dev back-end em formação</text>
  <text x="40" y="138"><tspan class="u">visitante@github</tspan><tspan class="w">:</tspan><tspan class="p">~</tspan><tspan class="w">$ </tspan>./objetivos --atual</text>
  <text x="40" y="166"><tspan class="p">[&gt;]</tspan> Aprofundar Python e Java para back-end</text>
  <text x="40" y="194"><tspan class="p">[&gt;]</tspan> Construir APIs REST com Spring Boot / FastAPI</text>
  <text x="40" y="222"><tspan class="p">[&gt;]</tspan> Dominar SQL: modelagem, índices e performance</text>
  <text x="40" y="250"><tspan class="p">[&gt;]</tspan> Aprender Git avançado, Docker e deploy</text>
  <text x="40" y="278"><tspan class="p">[&gt;]</tspan> Entender segurança, redes e autenticação JWT</text>
  <text x="40" y="306"><tspan class="u">visitante@github</tspan><tspan class="w">:</tspan><tspan class="p">~</tspan><tspan class="w">$ </tspan></text>

  <!-- Cursor (fica escondido pela máscara até a última linha ser digitada) -->
  <rect class="cur" x="222" y="292" width="9" height="18" fill="#00f0ff"/>

  <!-- Máscaras de digitação -->
  <rect class="cv c0" x="40" y="66"  width="246" height="24"/>
  <rect class="cv c1" x="40" y="94"  width="246" height="24"/>
  <rect class="cv c2" x="40" y="122" width="363" height="24"/>
  <rect class="cv c3" x="40" y="150" width="390" height="24"/>
  <rect class="cv c4" x="40" y="178" width="453" height="24"/>
  <rect class="cv c5" x="40" y="206" width="453" height="24"/>
  <rect class="cv c6" x="40" y="234" width="390" height="24"/>
  <rect class="cv c7" x="40" y="262" width="444" height="24"/>
  <rect class="cv c8" x="40" y="290" width="192" height="24"/>
</svg>
