<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Sistema inicializando: Back-end Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset="1" stop-color="#0c1428"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="0.85" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text{font-family:'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}
    .log{font-size:13px;fill:#9fb3c8}
    .ok{fill:#39ff14}
    .hot{fill:#ff2bd6}
    .dim{fill:#5f7796;font-size:12px}

    /* Ciclo total: 14s. Cada elemento aparece em um momento da sequência de boot */
    .l1{animation:k1 14s infinite}
    .l2{animation:k2 14s infinite}
    .l3{animation:k3 14s infinite}
    .l4{animation:k4 14s infinite}
    .bar{transform-box:fill-box;transform-origin:left center;animation:kbar 14s infinite}
    .title{animation:ktitle 14s infinite}
    .gA,.gB{opacity:0}
    .gA{animation:gla 14s infinite}
    .gB{animation:glb 14s infinite}
    .sub{animation:ksub 14s infinite}
    .st{animation:kst 14s infinite}
    .cur{animation:blink 1s steps(1) infinite}
    .scan{animation:scan 5s linear infinite}
    .r1{transform-origin:840px 170px;animation:spin 40s linear infinite}
    .r2{transform-origin:840px 170px;animation:spin 14s linear infinite reverse}
    .r3{transform-origin:840px 170px;animation:spin 9s linear infinite}
    .core{animation:pulse 2.4s ease-in-out infinite}

    @keyframes k1{0%,2%{opacity:0}3%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes k2{0%,6%{opacity:0}7%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes k3{0%,10%{opacity:0}11%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes k4{0%,14%{opacity:0}15%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes kbar{0%,4%{transform:scaleX(0);opacity:1}24%,96%{transform:scaleX(1);opacity:1}99%,100%{transform:scaleX(1);opacity:0}}
    @keyframes ktitle{0%,24%{opacity:0}25%{opacity:1}26%{opacity:.15}27%{opacity:1}28%{opacity:.4}29%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes gla{0%,49%{opacity:0;transform:translate(0,0)}50%{opacity:.85;transform:translate(-4px,1px)}51%{opacity:.85;transform:translate(3px,-1px)}52%,74%{opacity:0}75%{opacity:.85;transform:translate(4px,0)}76%,100%{opacity:0}}
    @keyframes glb{0%,49%{opacity:0;transform:translate(0,0)}50%{opacity:.85;transform:translate(4px,-1px)}51%{opacity:.85;transform:translate(-3px,1px)}52%,74%{opacity:0}75%{opacity:.85;transform:translate(-4px,0)}76%,100%{opacity:0}}
    @keyframes ksub{0%,32%{opacity:0}33%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes kst{0%,36%{opacity:0}37%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes scan{0%{transform:translateY(-4px)}100%{transform:translateY(344px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <!-- Fundo -->
  <rect width="1000" height="340" fill="url(#bg)"/>
  <rect width="1000" height="340" fill="url(#grid)"/>
  <rect width="1000" height="340" fill="url(#halo)"/>

  <!-- Molduras HUD -->
  <g fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="square" opacity="0.85">
    <path d="M14 44V14H44"/>
    <path d="M956 14H986V44"/>
    <path d="M14 296V326H44"/>
    <path d="M986 296V326H956"/>
  </g>
  <text x="960" y="34" text-anchor="end" class="dim">SYS://DEV.PROFILE · v2.0</text>

  <!-- Log de boot -->
  <text class="log l1" x="40" y="62"><tspan class="ok">[ OK ]</tspan> carregando kernel.dev</text>
  <text class="log l2" x="40" y="82"><tspan class="ok">[ OK ]</tspan> montando módulos: html · css · js</text>
  <text class="log l3" x="40" y="102"><tspan class="ok">[ OK ]</tspan> conectando banco_de_dados.sql</text>
  <text class="log l4" x="40" y="122"><tspan class="hot">[ &gt;&gt; ]</tspan> iniciando servidor back-end ...</text>

  <!-- Barra de progresso -->
  <rect x="40" y="140" width="380" height="6" rx="3" fill="#12203a"/>
  <rect class="bar" x="40" y="140" width="380" height="6" rx="3" fill="url(#neon)" filter="url(#glow)"/>

  <!-- Título (troque Diogo Lucas) -->
  <g font-size="62" font-weight="800">
    <text class="gA" x="40" y="228" fill="#00f0ff">Diogo Lucas</text>
    <text class="gB" x="40" y="228" fill="#ff2bd6">Diogo Lucas</text>
    <text class="title" x="40" y="228" fill="url(#neon)" filter="url(#glow)">Diogo Lucas</text>
  </g>

  <!-- Subtítulo -->
  <g class="sub">
    <text x="42" y="272" font-size="20" fill="#c9d1d9">&gt; BACK-END DEVELOPER</text>
    <rect class="cur" x="290" y="256" width="11" height="20" fill="#00f0ff"/>
  </g>

  <!-- Status -->
  <g class="st">
    <circle cx="742" cy="316" r="4" fill="#39ff14" class="core"/>
    <text x="960" y="320" text-anchor="end" font-size="13" fill="#39ff14">SYSTEM ONLINE</text>
  </g>

  <!-- Reator / HUD JARVIS -->
  <circle class="r1" cx="840" cy="170" r="118" fill="none" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 10"/>
  <circle class="r2" cx="840" cy="170" r="94" fill="none" stroke="url(#neon)" stroke-width="2.5" stroke-dasharray="70 22 12 22"/>
  <circle class="r3" cx="840" cy="170" r="66" fill="none" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 7"/>
  <circle cx="840" cy="170" r="42" fill="#00f0ff" fill-opacity="0.07" stroke="#00f0ff" stroke-opacity="0.8"/>
  <text x="840" y="180" text-anchor="middle" font-size="28" font-weight="700" fill="#00f0ff" filter="url(#glow)">&lt;/&gt;</text>

  <!-- Scanline -->
  <rect class="scan" x="0" y="0" width="1000" height="3" fill="#00f0ff" opacity="0.14"/>
</svg>
